$schema: "https://moonrepo.dev/schemas/project.json"
layer: library
fileGroups:
  spec:
    - "spec/**/*.md"
  schemas:
    - "schemas/**/*.{json}"
  rules:
    - "rules/**/*.{yaml,yml}"
  conformance:
    - "conformance/**/*"
tasks:
  # Copy token-type schemas and naming-exceptions to the generated legacy copies
  # (packages/tokens, docs/site/public/schemas).
  sync-token-schemas:
    command:
      - node
      - scripts/sync-token-schemas.mjs
    inputs:
      - "@globs(schemas)"
      - "/packages/design-data/naming-exceptions.json"
      - "scripts/sync-token-schemas.mjs"
    options:
      cache: false
  check-token-schemas:
    command:
      - node
      - scripts/sync-token-schemas.mjs
      - --check
    inputs:
      - "@globs(schemas)"
      - "/packages/design-data/naming-exceptions.json"
      - "/packages/tokens/schemas/**/*"
      - "/packages/tokens/naming-exceptions.json"
      - "/docs/site/public/schemas/token-types/*"
      - "/docs/site/public/schemas/token-file.json"
      - "scripts/sync-token-schemas.mjs"
  check:
    deps:
      - ~:check-token-schemas
    command:
      - node
      - scripts/check-layout.mjs
    inputs:
      - "@globs(spec)"
      - "@globs(schemas)"
      - "@globs(rules)"
      - "@globs(conformance)"
      - "scripts/check-layout.mjs"
