# Selects an incubating platform manifest (h890.27.7) for local development and
# CI dogfooding from anywhere inside this repo, e.g.:
#   design-data validate-manifest --platform react-spectrum
#   design-data platform list
#
# No [source] block: this repo *is* the foundation dataset, so the resolver's
# normal in-repo probing (tier 3) still finds packages/tokens/** on its own.
# This file only adds named platform-manifest entries on top of that; it has
# no effect unless --platform/DESIGN_DATA_PLATFORM is used.
#
# See platforms/README.md for the incubation model and ejection contract.

[platforms]
ios = "platforms/ios/manifest.json"
react-spectrum = "platforms/react-spectrum/manifest.json"
web-components = "platforms/web-components/manifest.json"

# Owned by its implementation repo (not incubated here); pinned by sha until a release tag exists.
[platforms.rune]
repo = "GarthDB/spectrum-rune"
sha = "f5f2573786ae011d4d3f49635d2296778b0bb7c9"
manifest_path = "platforms/rune/manifest.json"
