[package]
name = "design-data-png"
version = "0.1.0"
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Pure-Rust PNG renderer for Spectrum visual-recipe scenes (a SceneRenderer plugin)"

[lib]
path = "src/lib.rs"

[dependencies]
design-data-core = { path = "../../core", default-features = false }
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }

[features]
default = ["fallback-font"]
# Bundles Source Sans 3 (SIL OFL, `src/fonts/`) as the text font when none is supplied.
# The wasm build turns this off: the MCP server hands it the fonts it reads.
fallback-font = []

[dev-dependencies]
tempfile = "3.14"
