[package]
name = "hck9-slim-engine"
version = "0.0.0"
edition = "2021"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
design-data-core = { path = "../../core", default-features = false, features = ["wasm"] }
wasm-bindgen = "0.2"
serde_json = "1.0"

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[workspace]
