$schema: "https://moonrepo.dev/schemas/project.json"
layer: library
language: rust
# The slim solve-only visual engine (proposal 015, step 2). Not in .github/ci-targets.json: it
# runs only when a task input changes, so PRs that do not touch the renderer hit the Moon cache.
# Add it to the Rust job when the site loads it (step 3).
fileGroups:
  renderer:
    - "/sdk/core/src/visual*.rs"
    - "/sdk/core/src/text_metrics.rs"
    - "/sdk/core/src/text-metrics/*"
    - "/sdk/core/Cargo.toml"
    - "/sdk/Cargo.lock"
    - "src/**/*.rs"
    - "Cargo.toml"
    - "scripts/build.mjs"
tasks:
  # wasm-pack build of the slim engine for Node (pkg/node). Never committed.
  build:
    command: bash
    args:
      - -c
      - 'export PATH="$HOME/.cargo/bin:$PATH" && node scripts/build.mjs'
    inputs:
      - "@globs(renderer)"
    outputs:
      - "pkg/node"
    toolchain: "system"

  # Byte equality with `design-data render` over the request matrix, plus the size and
  # latency budgets. Builds the debug CLI here (not a separate cached task: a cache hit would
  # not restore its binary).
  test:
    command: bash
    args:
      - -c
      - 'export PATH="$HOME/.cargo/bin:$PATH" && cargo build -q -p design-data-cli --manifest-path ../Cargo.toml && node --test test/'
    inputs:
      - "@globs(renderer)"
      - "test/**/*.mjs"
      - "/sdk/cli/src/render_batch.rs"
      - "/sdk/plugins/site/src/**/*"
      - "/packages/design-data/visuals/*.json"
      - "/packages/design-data/icons/*.json"
      - "/platforms/ios/**/*"
      - "/.design-data.toml"
    deps:
      - build
    toolchain: "system"
