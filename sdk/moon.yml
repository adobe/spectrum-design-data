$schema: "https://moonrepo.dev/schemas/project.json"
language: rust
layer: library
fileGroups:
  sources:
    - "core/src/**/*.rs"
    - "cli/src/**/*.rs"
    - "tui/src/**/*.rs"
    # Integration tests live outside src/ — previously missing here, so CI
    # never re-ran sdk:test/lint when only a tests/ file changed.
    - "core/tests/**/*.rs"
    - "cli/tests/**/*.rs"
    - "tui/tests/**/*.rs"
    # Glob patterns, not literal filenames: moon's changed-file matching
    # doesn't register literal entries like "Cargo.toml" (only actual globs),
    # so the previous per-crate Cargo.toml/rust-toolchain.toml literals here
    # silently never triggered affected-task detection.
    - "*.toml"
    - "*/*.toml"
tasks:
  codegen:
    command: node
    args:
      - scripts/generate-registry-data.js
    inputs:
      - "/packages/design-data/registry/*.json"
    outputs:
      - "core/src/registry_data.rs"
  codegen-check:
    command: node
    args:
      - scripts/generate-registry-data.js
      - --check
    inputs:
      - "/packages/design-data/registry/*.json"
      - "core/src/registry_data.rs"
  build:
    command: cargo
    args:
      - build
      - --workspace
    inputs:
      - "@globs(sources)"
      - "core/src/registry_data.rs"
      # Embedded snapshot sources — invalidate the build when token data changes.
      - "/packages/design-data/tokens/*.tokens.json"
      - "/packages/tokens/schemas/**/*.json"
      - "/packages/tokens/naming-exceptions.json"
      - "/packages/tokens/manifest.json"
      - "/packages/design-data/mode-sets/*.json"
      - "/packages/design-data/components/*.json"
      - "/packages/design-data/fields/*.json"
      - "/packages/design-data/guidelines/*.json"
    deps:
      - codegen-check
  # cargo-nextest schedules all tests across one global thread pool instead of
  # one binary at a time, which matters here: tui/tests/ alone has 23 separate
  # integration-test binaries. Doctests aren't run by nextest, so they're a
  # separate task below (test-doc) — see .github/ci-targets.json.
  test:
    command: cargo
    args:
      - nextest
      - run
      - --workspace
    inputs:
      - "@globs(sources)"
      - "core/src/registry_data.rs"
      # Embedded snapshot sources — re-run tests when token data changes.
      - "/packages/design-data/tokens/*.tokens.json"
      - "/packages/tokens/schemas/**/*.json"
      - "/packages/tokens/naming-exceptions.json"
      - "/packages/tokens/manifest.json"
      - "/packages/design-data/mode-sets/*.json"
      - "/packages/design-data/components/*.json"
      - "/packages/design-data/fields/*.json"
      - "/packages/design-data/guidelines/*.json"
    deps:
      - codegen-check
  # nextest doesn't run doctests — this covers the runnable ```rust examples
  # in core/src (write.rs, naming.rs, legacy.rs, migrate.rs, cascade.rs, etc).
  test-doc:
    command: cargo
    args:
      - test
      - --workspace
      - --doc
    inputs:
      - "@globs(sources)"
      - "core/src/registry_data.rs"
      - "/packages/design-data/tokens/*.tokens.json"
      - "/packages/tokens/schemas/**/*.json"
      - "/packages/tokens/naming-exceptions.json"
      - "/packages/tokens/manifest.json"
      - "/packages/design-data/mode-sets/*.json"
      - "/packages/design-data/components/*.json"
      - "/packages/design-data/fields/*.json"
      - "/packages/design-data/guidelines/*.json"
    deps:
      - codegen-check
  fmt:
    command: cargo
    args:
      - fmt
      - --all
    inputs:
      - "@globs(sources)"
    options:
      runInCI: false
  fmt-check:
    command: cargo
    args:
      - fmt
      - --all
      - "--"
      - --check
    inputs:
      - "@globs(sources)"
  lint:
    command: cargo
    args:
      - clippy
      - --workspace
      - --
      - -D
      - warnings
    inputs:
      - "@globs(sources)"
  tui:
    command: cargo
    args:
      - run
      - -p
      - design-data-cli
      - --release
      - --
      - packages/tokens/dist/json
      - --theme
      - spectrum
      - --no-resume-wizard
    toolchain: "system"
    options:
      runInCI: false
  version:
    command: node
    args:
      - scripts/sync-cargo-version.mjs
    inputs:
      - "tui/package.json"
    outputs:
      - "tui/Cargo.toml"
