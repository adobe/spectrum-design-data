$schema: "https://moonrepo.dev/schemas/project.json"
layer: tool
tasks:
  # Chrome-dependent tests skip when system Chrome or the design-data CLI is missing.
  test:
    command: [pnpm, ava]
    inputs:
      - "lib/**/*"
      - "adapters/**/*"
      - "package.json"
      - "/pnpm-lock.yaml"
      # the render-compare test runs the CLI against the repo dataset
      - "/packages/design-data/components/**/*.json"
      - "/packages/design-data/visuals/**/*.json"
      - "/packages/design-data/relationships/**/*.json"
