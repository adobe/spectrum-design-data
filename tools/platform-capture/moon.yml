$schema: "https://moonrepo.dev/schemas/project.json"
layer: tool
tasks:
  # Chrome-dependent tests skip when system Chrome or the design-data CLI is missing.
  test:
    command: [pnpm, ava]
    inputs:
      - "lib/**/*"
      - "adapters/**/*"
      - "package.json"
      - "/pnpm-lock.yaml"
      # the render-compare test runs the CLI against the repo dataset
      - "/packages/design-data/components/**/*.json"
      - "/packages/design-data/visuals/**/*.json"
      - "/packages/design-data/relationships/**/*.json"
      - "/packages/design-data/icons/**/*.json"
  # Needs system Chrome and `moon run hub-prototype:build`; not part of the always-run CI set.
  test-site-switch:
    command: [node, e2e/site-switch.mjs]
    inputs:
      - "e2e/**/*"
      - "/sdk/plugins/site/assets/**/*"
    options:
      runInCI: false
