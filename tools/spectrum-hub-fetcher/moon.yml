$schema: "https://moonrepo.dev/schemas/project.json"

project:
  name: "spectrum-hub-fetcher"
  description: "Fetch public spectrum-hub pages and emit s2-docs markdown files"

tasks:
  test:
    command:
      - pnpm
      - ava
    options:
      runInCI: true

  fetch:
    command:
      - node
      - src/cli.js
    options:
      runInCI: false
