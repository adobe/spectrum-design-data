$schema: "https://moonrepo.dev/schemas/project.json"
layer: tool
tasks:
  # code.js/ui.html run unbundled in the Figma plugin sandbox (see code.js header) —
  # there's no build step. This only catches JS syntax errors; the plugin's actual
  # behavior can only be verified by loading it in the Figma desktop app (not
  # headless-CI-able — see the plan's Stage 2 caveat).
  check:
    command:
      - node
      - --check
      - code.js
  test:
    command:
      - pnpm
      - ava
