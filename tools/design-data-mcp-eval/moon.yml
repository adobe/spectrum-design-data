$schema: "https://moonrepo.dev/schemas/project.json"
layer: tool
tasks:
  test:
    command: [pnpm, ava]
    deps:
      - design-data-mcp:stage
    inputs:
      - "src/**/*.js"
      - "test/**/*.js"
      - "ava.config.js"
      - "package.json"
      - "/pnpm-lock.yaml"
      - "/packages/design-data/guidelines/**/*.json"
      - "/packages/design-data/components/**/*.json"
      - "/tools/design-data-mcp/src/**/*.js"
      - "/tools/design-data-mcp/test/helpers/**/*"
      - "/tools/design-data/src/**/*.js"
  evaluate:
    command: [node, src/cli.js]
    deps:
      - design-data-mcp:stage
    options:
      cache: false
      runInCI: false
