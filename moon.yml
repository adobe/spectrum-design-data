$schema: "https://moonrepo.dev/schemas/project.json"
stack: "infrastructure"
tasks:
  test:
    command:
      - pnpm
      - ava
      - test
    inputs:
      - "test/**/*"
      - ".github/workflows/**/*.yml"
      - "package.json"
      - "pnpm-lock.yaml"
  pre-commit:
    command:
      - pnpm
      - lint-staged
    options:
      runInCI: false
  prepare:
    command:
      - pnpm
      - "husky || true"
    options:
      runInCI: false
  release:
    command:
      - pnpm
      - changeset publish
    options:
      runInCI: false
  # Validates every incubating platforms/<id>/manifest.json via the same
  # `design-data --platform <id> validate-manifest` check a consumer would
  # run locally (spectrum-design-data-h890.27.12). Prints `platform show`
  # per id for advisory foundation-drift visibility.
  validate-platforms:
    command:
      - node
      - .github/scripts/validate-platforms.mjs
    deps:
      - sdk:build
    inputs:
      - "/platforms/**/*"
      - "/.design-data.toml"
      - ".github/scripts/validate-platforms.mjs"
  # SPEC-076: every recipe binding that resolves on the foundation also resolves under each
  # platform manifest (p6ga.8.2).
  validate-platform-recipes:
    command:
      - node
      - .github/scripts/validate-platform-recipes.mjs
    deps:
      - sdk:build
    inputs:
      - "/platforms/**/*"
      - "/.design-data.toml"
      - "/packages/design-data/tokens/**/*"
      - "/packages/design-data/components/**/*"
      - "/packages/design-data/relationships/**/*"
      - "/packages/design-data/visuals/**/*"
      - "/packages/design-data/mode-sets/**/*"
      - "/packages/design-data/naming-exceptions.json"
      - ".github/scripts/validate-platform-recipes.mjs"
  # Fails when tooling references the generated legacy token package outside
  # scripts/legacy-consumers.allowlist.json (xqln.12).
  check-legacy-consumers:
    command:
      - node
      - scripts/check-legacy-consumers.mjs
    options:
      cache: false
  # Verifies .ai/ sources are valid and generated AI resources (instructions,
  # repo index, llms.txt) are current. Fix drift with `pnpm ai:sync`.
  ai-check:
    command:
      - node
      - .ai/scripts/validate.js
    inputs:
      - "/.ai/**/*"
      - "/AGENTS.md"
      - "/**/AGENTS.md"
      - "/**/CLAUDE.md"
      - "/**/llms.txt"
      - "/**/README.md"
      - "/**/package.json"
      - "/docs/repo-index.md"
      - "/.github/instructions/**/*"
