name: Release Snapshot

# Snapshot branches (snapshot-* or snapshot/*) are disposable publishing branches.
# Never merge their snapshot release commits into main, beta, or a source PR.
# Create a separate snapshot branch from the source PR; discard it after testing.
# changeset version --snapshot intentionally consumes pending changesets and
# commits snapshot versions. Keep the original changesets on the source branch.
# Land source changes, not snapshot release commits, through the normal PR flow.
# Stable releases use release.yml (main/beta -> Version Packages PR).
# The guard enforces the naming convention; the prefix alone is not proof that
# a branch is disposable. Do not rename a merge-bound branch to bypass it.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag used on changeset version and NPM package"
        required: false
        type: string

jobs:
  get-snapshot-tag:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      fragment: ${{ steps.split.outputs.fragment }}
    steps:
      - name: Validate snapshot branch
        env:
          BRANCH: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [[ "$REF_TYPE" != "branch" ]]; then
            echo "::error::Snapshot releases require a disposable snapshot branch, not a tag."
            exit 1
          fi
          case "$BRANCH" in
            snapshot-?*|snapshot/?*) ;;
            *)
              echo "::error::Use a disposable snapshot-* or snapshot/* branch. This workflow consumes changesets and pushes snapshot versions; never run it on a merge-bound branch."
              exit 1
              ;;
          esac
      - name: Split branch name
        id: split
        env:
          BRANCH: ${{ github.ref_name }}
        run: |
          case "$BRANCH" in
            snapshot-*) fragment="${BRANCH#snapshot-}" ;;
            snapshot/*) fragment="${BRANCH#snapshot/}" ;;
          esac
          echo "fragment=$fragment" >> "$GITHUB_OUTPUT"

  build-wasm:
    needs: get-snapshot-tag
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.88.0"
          targets: wasm32-unknown-unknown
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "sdk -> sdk/target"
          key: wasm
      - uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"
      - run: npm install -g pnpm@10.17.1
      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm-store
      - run: pnpm install --frozen-lockfile
      - uses: moonrepo/setup-toolchain@v0
        with:
          auto-install: true
      - name: Build wasm package
        run: moon run sdk-wasm:build
      - name: Upload wasm package build
        uses: actions/upload-artifact@v4
        with:
          name: wasm-pkg-build
          path: sdk/wasm/pkg
          retention-days: 1
          if-no-files-found: error

  release:
    needs: [get-snapshot-tag, build-wasm]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Get last author info
        id: author
        run: |
          echo "authorName=$(git log -1 --pretty=format:'%an')" >> $GITHUB_OUTPUT
          echo "authorEmail=$(git log -1 --pretty=format:'%ae')" >> $GITHUB_OUTPUT
      # Keep Moon/proto shims in build-wasm, outside the OIDC publishing job.
      - uses: actions/setup-node@v4
        with:
          node-version: "20.17.0"
      - run: npm install -g npm@11.6.2 # npm 11.6.2 required for OIDC trusted publishing
      - run: npm install -g pnpm@10.17.1
      - name: Cache pnpm store
        uses: ./.github/actions/cache-pnpm-store
      - run: pnpm install --frozen-lockfile
      - name: Build tokens package
        run: |
          cd packages/tokens
          node tasks/buildSpectrumTokens.js
          node tasks/buildManifest.js
      - name: Download wasm package build
        uses: actions/download-artifact@v4
        with:
          name: wasm-pkg-build
          path: sdk/wasm/pkg
      - name: Snapshot release
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
          SNAPSHOT_TAG: ${{ inputs.tag || needs.get-snapshot-tag.outputs.fragment }}
          USERNAME: ${{ steps.author.outputs.authorName }}
          EMAIL: ${{ steps.author.outputs.authorEmail }}
        run: |
          pnpm changeset version --snapshot $SNAPSHOT_TAG
          node sdk/wasm/scripts/verify-package.mjs
          git config --global user.name "$USERNAME"
          git config --global user.email "$EMAIL"
          git add .
          git commit -m "chore: snapshot release $SNAPSHOT_TAG"
          pnpm changeset publish --tag $SNAPSHOT_TAG
          git push origin HEAD
          git push --tags
