# Proves `requires.cli` in packages/design-data/dataset.json: the released CLI it names must
# draw the smoke set like the CLI built from this branch. See tools/cli-minimum-gate/gate.sh.
name: CLI minimum gate
on:
  pull_request:
    paths:
      - "packages/design-data/**"
      - "packages/design-data-spec/**"
      - "sdk/**"
      - "tools/cli-minimum-gate/**"
      - ".github/workflows/cli-minimum-gate.yml"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: CLI minimum gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.88.0
      # lld is the linker sdk/.cargo/config.toml sets for x86_64-unknown-linux-gnu.
      - name: Install lld
        run: sudo apt-get update && sudo apt-get install -y lld
      # Only main saves the cache (rust-cache-warm.yml); PRs restore it.
      # The key hashes sdk/Cargo.toml: rust-cache ignores the workspace root manifest, so a
      # profile change there (opt-level) would otherwise reuse a cache built with the old one.
      # The workspace is sdk/, so its target dir is "target" relative to it.
      - name: Cache Cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: sdk
          shared-key: rust-ci-${{ hashFiles('sdk/Cargo.toml') }}
          save-if: false
      - name: Build the current CLI
        run: cargo build --manifest-path sdk/Cargo.toml -p design-data-cli
      - name: Check requires.cli against the released CLI
        env:
          GH_TOKEN: ${{ github.token }}
        run: tools/cli-minimum-gate/gate.sh
