<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Design data visual recipes</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 720px;
        margin: 48px auto;
        padding: 0 16px;
        color: #222;
      }
      ul {
        list-style: none;
        padding: 0;
        display: grid;
        gap: 12px;
      }
      a.card {
        display: block;
        padding: 16px 20px;
        border: 1px solid #d5d5d5;
        border-radius: 12px;
        color: inherit;
        text-decoration: none;
      }
      a.card:hover,
      a.card:focus-visible {
        border-color: #222;
      }
      a.card strong {
        display: block;
        font-size: 18px;
      }
    </style>
  </head>
  <body>
    <h1>Design data visual recipes</h1>
    <p>One build per platform. Pick one to explore its components.</p>
    <ul id="platforms"></ul>
    <p><a href="specs/">Component spec sheets and changelogs</a> (generated)</p>
    <script>
      fetch("platforms.json")
        .then((r) => (r.ok ? r.json() : Promise.reject(r.status)))
        .then((all) => {
          const list = document.getElementById("platforms");
          for (const p of all) {
            const li = list.appendChild(document.createElement("li"));
            const a = li.appendChild(document.createElement("a"));
            a.className = "card";
            a.href = p.path;
            a.appendChild(document.createElement("strong")).textContent =
              p.label;
            a.append(p.description ?? "");
          }
        })
        .catch(() => {
          document.getElementById("platforms").textContent =
            "The platform list could not be loaded.";
        });
    </script>
  </body>
</html>
